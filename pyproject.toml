[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biliup"
version = "1.1.7"
readme = "README.md"
authors = [{ name = "ForgQi" }]
description = "Stream recording and Bilibili upload service"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp[speedups]>=3.9.5",
    "aiohttp-cors>=0.7.0",
    "alembic>=1.12.1",
    "argon2-cffi>=23.1.0",
    "async-lru>=2.0.5",
    "fastapi>=0.115.0",
    "gmssl>=3.2.2",
    "httpx[http2]>=0.28.1",
    "itsdangerous>=2.2.0",
    "m3u8>=6.0.0",
    "Pillow>=10.0.0",
    "platformdirs>=4.3.0",
    "protobuf>=4.23.0",
    "psutil>=5.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PyYAML>=6.0.0",
    "requests>=2.32.3",
    "rsa>=4.9",
    "SQLAlchemy>=2.0.0",
    "streamlink>=7.5.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "truststore>=0.10.1; python_version >= '3.10'",
    "uvicorn[standard]>=0.34.0",
    "ykdl>=1.8.0",
    "yt-dlp>=2025.7.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]
selenium = ["selenium>=4.0.0"]

[project.scripts]
biliup = "biliup.__main__:main"

[tool.setuptools.packages.find]
include = ["biliup*"]

[tool.setuptools.package-data]
biliup = [
    "web/public/**/*",
    "database/migrations/README",
    "database/migrations/*.py",
    "database/migrations/*.mako",
    "database/migrations/versions/*.py",
]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
